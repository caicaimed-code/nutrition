<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dad's Nutrition</title>
<meta name="description" content="Daily food and nutrition tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.nal.usda.gov">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column. Calorie ring on top, macro tiles, meals, fixed "Log food" bar at the bottom. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #EEF1F5;
  --fg: #12161C;
  --muted: #677084;
  --line: #E1E5EB;
  --ink: #12161C;
  --on-ink: #FFFFFF;
  --track: #E6EAF0;
  --protein: #E0484F;
  --carbs: #2F7FE6;
  --fat: #E4A200;
  --fiber: #24A066;
  --warn: #C2410C;
  --shadow: 0 1px 2px rgba(18,22,28,.05), 0 4px 16px rgba(18,22,28,.04);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015; --surface: #161A21; --surface-2: #1E232C; --fg: #F1F3F6; --muted: #98A1B2;
    --line: #262C36; --ink: #F1F3F6; --on-ink: #0D1015; --track: #252B35;
    --protein: #F0646A; --carbs: #5B9BF0; --fat: #F0B92E; --fiber: #3BBE80; --warn: #F2804A;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #161A21; --surface-2: #1E232C; --fg: #F1F3F6; --muted: #98A1B2;
  --line: #262C36; --ink: #F1F3F6; --on-ink: #0D1015; --track: #252B35;
  --protein: #F0646A; --carbs: #5B9BF0; --fat: #F0B92E; --fiber: #3BBE80; --warn: #F2804A;
  --shadow: none; color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; height: 100%; overflow-x: hidden; touch-action: pan-y; }
body { margin: 0; min-height: 100%; overflow-x: hidden; overscroll-behavior: none; touch-action: pan-y; }
input, select, textarea, button { touch-action: manipulation; }
input, select, textarea { max-width: 100%; }
img { max-width: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--carbs); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

.app {
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(104px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.top h1 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.top .date { color: var(--muted); font-size: 14px; font-weight: 500; }
.chip {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 6px 10px; white-space: nowrap;
}

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }

/* Calories */
.cal { padding: 20px 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.ring-wrap { position: relative; width: 200px; max-width: 100%; aspect-ratio: 1; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--track); stroke-width: 11; }
.ring-fill { fill: none; stroke: var(--ink); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .5s ease, stroke .3s; }
.ring-fill.over { stroke: var(--warn); }
.ring-fill.zero { stroke-linecap: butt; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-center .big { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.ring-center .big.over { color: var(--warn); }
.ring-center .lbl { color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 6px; }
.cal-stats { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); padding-top: 14px; }
.cal-stats div { text-align: center; }
.cal-stats .v { font-size: 19px; font-weight: 700; }
.cal-stats .k { color: var(--muted); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

/* Macros */
.macros { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.macro { padding: 14px 14px 13px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.macro .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.macro .name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
.macro .chev { color: var(--muted); font-size: 18px; line-height: 1; }
.macro .amt { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.macro .amt small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.bar { height: 7px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c); transition: width .5s ease; }
.macro .left { font-size: 12px; color: var(--muted); }
.macro .left.over { color: var(--warn); font-weight: 600; }

/* Meals */
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 2px -4px; }
.section-h h2 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.section-h span { color: var(--muted); font-size: 13px; }
.meals { display: flex; flex-direction: column; gap: 10px; }
.meal { padding: 4px 0; }
.meal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 8px 16px; }
.meal-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.meal-head .kcal { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 500; }
.add-btn {
  display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600;
  padding: 8px 12px; border-radius: 999px; background: var(--surface-2); flex: none;
}
.items { list-style: none; margin: 0; padding: 0 0 6px; }
.item { border-top: 1px solid var(--line); margin-left: 16px; }
.item-main { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px 11px 0; text-align: left; }
.item-main .t { min-width: 0; }
.item-main .n { font-weight: 500; overflow-wrap: anywhere; }
.item-main .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.item-main .k { font-weight: 600; white-space: nowrap; }
.item-edit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px 12px 0; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: 600; background: var(--surface); }
.stepper .q { min-width: 52px; text-align: center; font-weight: 600; }
.remove { color: var(--warn); font-weight: 600; font-size: 14px; padding: 8px 4px; }
.empty { color: var(--muted); font-size: 14px; padding: 0 16px 14px; margin: 0; }

.foot-note { color: var(--muted); font-size: 12px; text-align: center; margin: 4px 0 0; }

/* Logged food rows */
.log-card { padding: 2px 0; }
.log-card .items { padding: 0; }
.log-card .item:first-child { border-top: 0; }
.when { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
.tag.meal { background: var(--ink); color: var(--on-ink); }
.tag.snack { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.item-edit { flex-wrap: wrap; }
.edit-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; justify-content: space-between; }
.time-in {
  height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  font: inherit; font-size: 16px; padding: 0 10px; min-width: 0;
}
.log-empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
.log-empty strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 2px; }

/* Meal / Snack switch */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { height: 38px; border-radius: 9px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.small { width: 170px; }
.seg.small button { height: 34px; font-size: 14px; }

/* Custom food */
.custom-entry { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); text-align: left; }
.custom-entry .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 18px; flex: none; }
.custom-entry .t { flex: 1; min-width: 0; }
.custom-entry .n { font-weight: 600; }
.custom-entry .m { color: var(--muted); font-size: 13px; }
.form { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.field input {
  height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  font: inherit; font-size: 16px; padding: 0 14px; width: 100%; min-width: 0;
}
.field input.big { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.field .unit { position: relative; }
.field .unit input { padding-right: 46px; }
.field .unit span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.form, .detail { min-width: 0; max-width: 100%; }
.more-btn { align-self: flex-start; color: var(--muted); font-weight: 600; font-size: 14px; padding: 4px 0; }
.check { font-size: 13px; color: var(--muted); }
.check.warn { color: var(--warn); }
.time-field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: end; }
input[type="time"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; text-align: left; }
input[type="time"]::-webkit-date-and-time-value { text-align: left; }

/* Bottom bar */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding-top: 18px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.log-btn, .primary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 56px; border-radius: 16px;
  background: var(--ink); color: var(--on-ink); font-size: 17px; font-weight: 600;
}
.log-btn { max-width: 448px; margin: 0 auto; }
.log-btn .plus { font-size: 24px; font-weight: 500; line-height: 1; }
.primary:disabled { opacity: .45; cursor: default; }

/* Add-food sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,10,14,.45); opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 520px; margin: 0 auto; height: 90%; height: 90dvh;
  background: var(--surface); border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .25s ease;
}
.sheet.show { transform: translateY(0); }
.pad-x {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-head { padding-top: 10px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); flex: none; }
.grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 0 auto; }
.sheet-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.sheet-title h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.done, .back { font-weight: 600; padding: 8px 4px; }
.back { display: inline-flex; align-items: center; gap: 4px; }
.back span { font-size: 22px; line-height: 1; margin-top: -2px; }
.meal-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.meal-chips::-webkit-scrollbar { display: none; }
.meal-chips button {
  padding: 8px 14px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 600; white-space: nowrap;
}
.meal-chips button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.search-wrap { position: relative; }
.search {
  width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); padding: 0 40px 0 14px; font: inherit; font-size: 16px;
  -webkit-appearance: none; appearance: none;
}
.search::-webkit-search-cancel-button { display: none; }
.clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; color: var(--muted); font-size: 18px; }

.sheet-body { flex: 1; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.group-label {
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding-top: 16px; padding-bottom: 4px;
}
.food-list { list-style: none; margin: 0; padding: 0; }
.food {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding-top: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.food .t { flex: 1; min-width: 0; }
.food .n { font-weight: 500; overflow-wrap: anywhere; }
.food .m { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; margin-top: 1px; }
.food .k { text-align: right; flex: none; }
.food .k b { display: block; font-weight: 600; font-size: 15px; }
.food .k small { color: var(--muted); font-size: 11.5px; }
.food .add { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; flex: none; }
.state { color: var(--muted); font-size: 14px; padding-top: 24px; text-align: center; line-height: 1.5; }
.state strong { color: var(--fg); display: block; font-size: 15px; margin-bottom: 4px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--fg); margin: 0 auto 10px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Food detail */
.detail { padding-top: 16px; display: flex; flex-direction: column; gap: 16px; }
.detail h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; }
.detail .brand { color: var(--muted); font-size: 14px; margin-top: 4px; }
.amount { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }
.amount input, .amount select {
  height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--fg); font: inherit; font-size: 16px; padding: 0 12px; min-width: 0; width: 100%;
}
.amount input { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; }
.amount select { -webkit-appearance: none; appearance: none; padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 22px, calc(100% - 13px) 22px; background-size: 5px 5px; background-repeat: no-repeat; }
.amount label { grid-column: 1 / -1; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nut-card { background: var(--surface-2); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.nut-kcal { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.nut-kcal .v { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.nut-kcal .v small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.nut-kcal .est { font-size: 12px; color: var(--muted); }
.nut-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nut-grid div { min-width: 0; }
.nut-grid .v { font-size: 18px; font-weight: 700; }
.nut-grid .v.na { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); }
.nut-grid .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.nut-grid .dot { width: 7px; height: 7px; }
.source { font-size: 12px; color: var(--muted); }
.detail-foot { position: sticky; bottom: 0; background: linear-gradient(to top, var(--surface) 75%, transparent); padding-top: 12px; }
.loading-line { font-size: 12px; color: var(--muted); }

/* Toast */
.toast {
  position: fixed; left: 50%; z-index: 60; bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 12px;
  font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); text-align: center;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Today</h1>
      <div class="date" id="date"></div>
    </div>
    <span class="chip" title="Targets are placeholders until Dad's real goals are set">Sample targets</span>
  </header>

  <section class="card cal" aria-label="Calories">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fill" id="ring" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="ring-center">
        <div class="big num" id="calLeft">0</div>
        <div class="lbl" id="calLeftLbl">kcal left</div>
      </div>
    </div>
    <div class="cal-stats">
      <div><div class="v num" id="calEaten">0</div><div class="k">Eaten</div></div>
      <div><div class="v num" id="calTarget">0</div><div class="k">Target</div></div>
      <div><div class="v num" id="calPct">0%</div><div class="k">Of goal</div></div>
    </div>
  </section>

  <section class="macros" id="macros" aria-label="Macros"></section>

  <div class="section-h"><h2>Logged food</h2><span id="itemCount"></span></div>
  <div id="meals"></div>

  <p class="foot-note">Targets are samples until Dad's goals are set.<br>Food data from USDA FoodData Central.</p>
</div>

<div class="bottom">
  <button class="log-btn" type="button" id="logBtn"><span class="plus">+</span> Log food</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head pad-x">
    <div class="grab"></div>
    <div class="sheet-title">
      <button class="back" type="button" id="backBtn" hidden><span aria-hidden="true">‹</span> Back</button>
      <h2 id="sheetTitle">Add food</h2>
      <button class="done" type="button" id="doneBtn">Done</button>
    </div>
    <div class="seg" id="kindSeg" role="group" aria-label="Meal or snack">
      <button type="button" data-kind="meal" aria-pressed="true">Meal</button>
      <button type="button" data-kind="snack" aria-pressed="false">Snack</button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input class="search" id="search" type="search" placeholder="Search foods, like banana or Fage yogurt" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search foods">
      <button class="clear" type="button" id="clearBtn" aria-label="Clear search" hidden>✕</button>
    </div>
  </div>
  <div class="sheet-body pad-x" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------- Settings ----------
  var TARGETS = { kcal: 2000, protein: 150, carbs: 200, fat: 67, fiber: 30 }; // samples until Dad's goals are set
  var API_KEY = "mW7hWGzTbNFGcDbCPKpmcfgq6NFwfgTRdcnzqJqT";
  var API = "https://api.nal.usda.gov/fdc/v1";
  var STORE_KEY = "dads-nutrition-v2";

  var KINDS = { meal: "Meal", snack: "Snack" };
  var OLD_MEAL_TIME = { Breakfast: "08:00", Lunch: "12:30", Dinner: "18:30", Snacks: "15:00" };
  var MACROS = [
    { key: "protein", label: "Protein", color: "var(--protein)" },
    { key: "carbs",   label: "Carbs",   color: "var(--carbs)" },
    { key: "fat",     label: "Fat",     color: "var(--fat)" },
    { key: "fiber",   label: "Fiber",   color: "var(--fiber)" }
  ];

  // USDA nutrient ids
  var NID = { kcal: 1008, kcalSpecific: 2048, kcalGeneral: 2047, protein: 1003, fat: 1004, carbs: 1005, fiber: 1079 };
  // Extra nutrients kept per entry for later detail screens (amino acids, fats, sugar, vitamins, minerals)
  var KEEP = [1210,1211,1212,1213,1214,1215,1217,1219,1221, 1258,1292,1293,1257,1253, 2000,
              1087,1089,1090,1091,1092,1093,1095, 1106,1162,1114,1109,1185,1175,1178,1177,1165,1166,1167];

  // ---------- Small helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  function fmtG(n) { return n < 10 && n > 0 ? (Math.round(n * 10) / 10).toString() : fmt(n); }
  function r1(n) { return Math.round(n * 10) / 10; }
  function fmtQty(q) { return (Math.round(q * 100) / 100).toString(); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function nowHHMM() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function validTime(t) { return /^\d{2}:\d{2}$/.test(t || ""); }
  function fmtTime(t) {
    if (!validTime(t)) return "";
    var h = +t.slice(0, 2), m = t.slice(3, 5);
    return (h % 12 || 12) + ":" + m + " " + (h < 12 ? "AM" : "PM");
  }
  function byTime(a, b) { return (a.time || "").localeCompare(b.time || "") || a.id - b.id; }
  function parseNum(v) { var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) && n >= 0 ? n : null; }

  function niceName(s) {
    s = String(s || "").trim();
    if (!s) return "Unnamed food";
    var letters = s.replace(/[^A-Za-z]/g, "");
    if (letters && letters === letters.toUpperCase()) {
      s = s.toLowerCase().replace(/(^|[\s,(/&-])([a-z])/g, function (m, p, c) { return p + c.toUpperCase(); });
    } else {
      s = s.charAt(0).toUpperCase() + s.slice(1);
    }
    return s;
  }

  // ---------- Nutrition math (pure, tested) ----------
  function per100FromMap(map) {
    function v(id) { return typeof map[id] === "number" && isFinite(map[id]) ? map[id] : null; }
    var p = v(NID.protein), f = v(NID.fat), c = v(NID.carbs), fib = v(NID.fiber);
    var kcal = v(NID.kcal);
    if (kcal == null) kcal = v(NID.kcalSpecific);
    if (kcal == null) kcal = v(NID.kcalGeneral);
    var est = false;
    if (kcal == null && (p != null || f != null || c != null)) { kcal = (p || 0) * 4 + (c || 0) * 4 + (f || 0) * 9; est = true; }
    return { kcal: kcal, protein: p, carbs: c, fat: f, fiber: fib, est: est };
  }
  function mapFromSearch(item) {
    var m = {};
    (item.foodNutrients || []).forEach(function (n) {
      if (n && n.nutrientId != null && typeof n.value === "number") m[n.nutrientId] = n.value;
    });
    return m;
  }
  function mapFromDetail(food) {
    var m = {};
    (food.foodNutrients || []).forEach(function (n) {
      if (!n) return;
      var id = n.nutrient && n.nutrient.id != null ? n.nutrient.id : n.nutrientId;
      var amt = typeof n.amount === "number" ? n.amount : n.value;
      if (id != null && typeof amt === "number") m[id] = amt;
    });
    return m;
  }
  function keepNutrients(map) {
    var out = {};
    KEEP.forEach(function (id) { if (typeof map[id] === "number") out[id] = Math.round(map[id] * 1000) / 1000; });
    return out;
  }
  function buildUnits(food) {
    var units = [], seen = {};
    function add(label, grams) {
      var key = String(label).toLowerCase().replace(/[^a-z0-9]/g, "");
      if (!label || !(grams > 0) || seen[key]) return;
      seen[key] = 1; units.push({ label: label, grams: grams });
    }
    var su = String(food.servingSizeUnit || "g").toLowerCase();
    var liquid = su === "ml" || su === "mlt";
    if (food.dataType === "Branded" && food.servingSize > 0) {
      var hh = food.householdServingFullText ? niceName(food.householdServingFullText).replace(/^\w/, function (c) { return c.toLowerCase(); }) : "serving";
      add(hh + " (" + r1(food.servingSize) + " " + (liquid ? "ml" : "g") + ")", food.servingSize);
    }
    (food.foodPortions || []).forEach(function (p) {
      if (!p || !(p.gramWeight > 0)) return;
      var label = "";
      if (p.portionDescription && !/not specified/i.test(p.portionDescription)) label = p.portionDescription;
      else {
        var unit = p.measureUnit && p.measureUnit.name && p.measureUnit.name !== "undetermined" ? p.measureUnit.name : "";
        label = [p.amount != null ? fmtQty(p.amount) : "", unit, p.modifier || ""].filter(Boolean).join(" ");
      }
      if (label) add(label + " (" + r1(p.gramWeight) + " g)", p.gramWeight);
    });
    (food.foodMeasures || []).forEach(function (m) {
      if (m && m.gramWeight > 0 && m.disseminationText && !/not specified/i.test(m.disseminationText)) add(m.disseminationText + " (" + r1(m.gramWeight) + " g)", m.gramWeight);
    });
    if (liquid) { add("ml", 1); add("fl oz", 29.5735); }
    else { add("g", 1); add("oz", 28.3495); }
    return units;
  }
  function isRawUnit(label) { return label === "g" || label === "oz" || label === "ml" || label === "fl oz"; }
  function defaultQty(unit) { return unit.label === "g" || unit.label === "ml" ? 100 : 1; }
  function amountFor(per100, grams, key) {
    var v = per100[key];
    return v == null ? null : v * grams / 100;
  }
  function entryValue(e, key) { return amountFor(e.per100, e.unitGrams * e.qty, key) || 0; }
  function totals(list) {
    var t = { kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
    list.forEach(function (e) { for (var k in t) t[k] += entryValue(e, k); });
    return t;
  }
  function servingText(e) {
    if (e.unitLabel === "serving") return fmtQty(e.qty) + (e.qty === 1 ? " serving" : " servings");
    return isRawUnit(e.unitLabel) ? fmtQty(e.qty) + " " + e.unitLabel : fmtQty(e.qty) + " × " + e.unitLabel;
  }

  // Exposed for automated checks only
  window.__nutritionTest = { per100FromMap: per100FromMap, mapFromSearch: mapFromSearch, mapFromDetail: mapFromDetail, buildUnits: buildUnits, totals: totals, niceName: niceName, servingText: servingText };

  // ---------- Storage ----------
  var state = load();
  if (state.entries.length) save(); // keep migrated entries
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.entries)) {
          // Older entries used Breakfast/Lunch/Dinner/Snacks: turn them into Meal/Snack with a time
          s.entries.forEach(function (e) {
            if (!e.kind) e.kind = e.meal === "Snacks" ? "snack" : "meal";
            if (!validTime(e.time)) e.time = OLD_MEAL_TIME[e.meal] || "12:00";
            delete e.meal;
          });
          return s;
        }
      }
    } catch (e) {}
    return { version: 2, entries: [] };
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { toast("Couldn't save on this phone. Storage may be full."); } }
  try { localStorage.removeItem("dads-nutrition-preview-v1"); } catch (e) {}
  function nextId() { return state.entries.reduce(function (m, e) { return Math.max(m, e.id); }, 0) + 1; }
  function todays() { var k = dayKey(); return state.entries.filter(function (e) { return e.date === k; }); }

  // ---------- Home screen ----------
  var expanded = null;
  var CIRC = 2 * Math.PI * 52;
  $("ring").style.strokeDasharray = CIRC.toFixed(2);

  function render() {
    var list = todays();
    var t = totals(list);
    var left = TARGETS.kcal - t.kcal;
    var pct = t.kcal / TARGETS.kcal;

    $("date").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    var ring = $("ring");
    ring.style.strokeDashoffset = (CIRC * (1 - Math.min(pct, 1))).toFixed(2);
    ring.classList.toggle("over", left < 0);
    ring.classList.toggle("zero", t.kcal === 0);
    $("calLeft").textContent = fmt(Math.abs(left));
    $("calLeft").classList.toggle("over", left < 0);
    $("calLeftLbl").textContent = left < 0 ? "kcal over" : "kcal left";
    $("calEaten").textContent = fmt(t.kcal);
    $("calTarget").textContent = fmt(TARGETS.kcal);
    $("calPct").textContent = Math.round(pct * 100) + "%";

    $("macros").innerHTML = MACROS.map(function (m) {
      var v = t[m.key], goal = TARGETS[m.key], rem = goal - v;
      return '<button class="card macro" type="button" data-macro="' + m.key + '" style="--c:' + m.color + '">' +
        '<div class="row"><span class="name"><span class="dot"></span>' + m.label + '</span><span class="chev" aria-hidden="true">›</span></div>' +
        '<div class="amt num">' + fmt(v) + ' <small>/ ' + goal + ' g</small></div>' +
        '<div class="bar"><i style="width:' + Math.min(100, v / goal * 100).toFixed(1) + '%"></i></div>' +
        '<div class="left' + (rem < 0 ? ' over' : '') + '">' + (rem < 0 ? fmt(-rem) + ' g over' : fmt(rem) + ' g left') + '</div>' +
        '</button>';
    }).join("");

    var meals = list.filter(function (e) { return e.kind !== "snack"; }).length;
    var snacks = list.length - meals;
    $("itemCount").textContent = list.length ? [meals ? meals + (meals === 1 ? " meal" : " meals") : "", snacks ? snacks + (snacks === 1 ? " snack" : " snacks") : ""].filter(Boolean).join(" · ") : "";

    var sorted = list.slice().sort(byTime);
    $("meals").innerHTML = '<section class="card log-card">' + (sorted.length
      ? '<ul class="items">' + sorted.map(function (e) {
          var open = expanded === e.id;
          var kind = e.kind === "snack" ? "snack" : "meal";
          return '<li class="item">' +
            '<button class="item-main" type="button" data-toggle="' + e.id + '" aria-expanded="' + open + '">' +
              '<span class="t">' +
                '<div class="when"><span class="tag ' + kind + '">' + KINDS[kind] + '</span><span>' + esc(fmtTime(e.time)) + '</span></div>' +
                '<div class="n">' + esc(e.name) + '</div>' +
                '<div class="s">' + esc(servingText(e)) + (e.brand ? ' · ' + esc(e.brand) : '') + '</div>' +
              '</span>' +
              '<span class="k num">' + fmt(entryValue(e, "kcal")) + '</span>' +
            '</button>' +
            (open ? '<div class="item-edit">' +
              '<div class="edit-row">' +
                '<div class="stepper"><button type="button" data-dec="' + e.id + '" aria-label="Less">−</button><span class="q num">' + fmtQty(e.qty) + '</span><button type="button" data-inc="' + e.id + '" aria-label="More">+</button></div>' +
                '<input class="time-in" type="time" data-time="' + e.id + '" value="' + esc(e.time || "") + '" aria-label="Time eaten">' +
              '</div>' +
              '<div class="edit-row">' +
                '<div class="seg small" role="group" aria-label="Meal or snack">' +
                  '<button type="button" data-setkind="meal" data-id="' + e.id + '" aria-pressed="' + (kind === "meal") + '">Meal</button>' +
                  '<button type="button" data-setkind="snack" data-id="' + e.id + '" aria-pressed="' + (kind === "snack") + '">Snack</button>' +
                '</div>' +
                '<button class="remove" type="button" data-remove="' + e.id + '">Remove</button>' +
              '</div>' +
            '</div>' : '') +
            '</li>';
        }).join("") + '</ul>'
      : '<div class="log-empty"><strong>Nothing logged today</strong>Tap Log food to add a meal or a snack.</div>') + '</section>';
  }

  function stepFor(e) { return isRawUnit(e.unitLabel) ? (e.unitLabel === "g" || e.unitLabel === "ml" ? 10 : 0.5) : 0.5; }
  function findEntry(id) { return state.entries.find(function (x) { return x.id === id; }); }

  $("meals").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    var id, e;
    if (b.dataset.toggle) { id = +b.dataset.toggle; expanded = expanded === id ? null : id; render(); return; }
    if (b.dataset.setkind) {
      e = findEntry(+b.dataset.id); if (!e) return;
      e.kind = b.dataset.setkind; save(); render(); return;
    }
    if (b.dataset.inc || b.dataset.dec) {
      id = +(b.dataset.inc || b.dataset.dec);
      e = findEntry(id);
      if (!e) return;
      var step = stepFor(e);
      e.qty = Math.max(step, Math.round((e.qty + (b.dataset.inc ? step : -step)) * 100) / 100);
      save(); render(); return;
    }
    if (b.dataset.remove) {
      id = +b.dataset.remove;
      e = findEntry(id);
      state.entries = state.entries.filter(function (x) { return x.id !== id; });
      expanded = null; save(); render();
      if (e) toast("Removed " + e.name.split(",")[0]);
    }
  });
  $("meals").addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t.dataset || !t.dataset.time) return;
    var e = findEntry(+t.dataset.time);
    if (e && validTime(t.value)) { e.time = t.value; save(); render(); }
  });

  $("macros").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-macro]");
    if (!b) return;
    toast(b.querySelector(".name").textContent + " details are coming soon");
  });

  // ---------- Add-food sheet ----------
  var sheetKind = "meal";    // "meal" | "snack"
  var sheetTime = nowHHMM();
  var view = "search";       // "search" | "detail" | "custom"
  var results = null;        // { query, generic: [], branded: [], error }
  var searchTimer = null, searchCtrl = null, detailCtrl = null;
  var current = null;        // food being viewed: { fdcId, name, brand, dataType, per100, nutrients, units, unitIndex, qty, loading }

  function renderKind() {
    Array.prototype.forEach.call($("kindSeg").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.kind === sheetKind));
    });
    var add = $("addBtn");
    if (add) add.textContent = "Log " + KINDS[sheetKind].toLowerCase();
  }

  function recents() {
    var seen = {}, out = [];
    state.entries.slice().sort(function (a, b) { return b.id - a.id; }).forEach(function (e) {
      var k = (e.custom ? "custom:" + e.name + "|" + e.per100.kcal : (e.fdcId || e.name)) + "|" + e.unitLabel;
      if (seen[k] || out.length >= 12) return;
      seen[k] = 1; out.push(e);
    });
    return out;
  }

  function foodRow(attrs, name, meta, kcal, kcalNote) {
    return '<li><button class="food" type="button" ' + attrs + '>' +
      '<span class="t"><div class="n">' + esc(name) + '</div><div class="m">' + esc(meta) + '</div></span>' +
      '<span class="k"><b class="num">' + (kcal == null ? "–" : fmt(kcal)) + '</b><small>' + esc(kcalNote) + '</small></span>' +
      '</button></li>';
  }

  function renderSearchBody() {
    var q = $("search").value.trim();
    $("clearBtn").hidden = !q;
    var html = '<button class="custom-entry" type="button" data-custom="1"><span class="ic" aria-hidden="true">✎</span>' +
      '<span class="t"><div class="n">Custom food</div><div class="m">Type your own calories and macros</div></span><span class="add" aria-hidden="true">›</span></button>';
    if (q.length < 2) {
      var rec = recents();
      if (rec.length) {
        html += '<div class="group-label">Recent</div><ul class="food-list">' +
          rec.map(function (e) { return foodRow('data-recent="' + e.id + '"', e.name, servingText(e) + (e.brand ? " · " + e.brand : ""), entryValue(e, "kcal"), "kcal"); }).join("") + '</ul>';
      } else {
        html += '<div class="state"><strong>Search any food</strong>Try "banana", "chicken breast" or a brand like "Fage yogurt".</div>';
      }
    } else if (!results || results.query !== q || results.loading) {
      html += '<div class="state"><div class="spinner"></div>Searching…</div>';
    } else if (results.error) {
      html += '<div class="state"><strong>' + esc(results.error.title) + '</strong>' + esc(results.error.text) + '</div>';
    } else if (!results.generic.length && !results.branded.length) {
      html += '<div class="state"><strong>No foods found</strong>Try fewer words or a different spelling, or add it as a custom food.</div>';
    } else {
      if (results.generic.length) {
        html += '<div class="group-label">Common foods</div><ul class="food-list">' + results.generic.map(function (f, i) {
          var p = per100FromMap(mapFromSearch(f));
          return foodRow('data-pick="g' + i + '"', niceName(f.description), "Per 100 g", p.kcal, "kcal");
        }).join("") + '</ul>';
      }
      if (results.branded.length) {
        html += '<div class="group-label">Brands</div><ul class="food-list">' + results.branded.map(function (f, i) {
          var p = per100FromMap(mapFromSearch(f));
          var u = buildUnits(f)[0];
          var brand = niceName(f.brandName || f.brandOwner || "");
          var isServing = f.servingSize > 0;
          var kcal = p.kcal == null ? null : (isServing ? p.kcal * f.servingSize / 100 : p.kcal);
          return foodRow('data-pick="b' + i + '"', niceName(f.description), (brand ? brand + " · " : "") + (isServing ? u.label : "per 100 g"), kcal, isServing ? "per serving" : "per 100 g");
        }).join("") + '</ul>';
      }
    }
    $("sheetBody").innerHTML = html;
  }

  function apiError(status) {
    if (status === 429) return { title: "Too many searches right now", text: "The food database limits searches per hour. Try again in a little while." };
    if (status === 403 || status === 401) return { title: "Food search isn't connected", text: "The database key was refused. Tell Caio so he can fix it." };
    return { title: "Search didn't work", text: "The food database had a problem. Try again in a moment." };
  }

  function fetchJSON(url, signal) {
    return fetch(url, { signal: signal }).then(function (res) {
      if (!res.ok) { var err = new Error("http " + res.status); err.status = res.status; throw err; }
      return res.json();
    });
  }

  function searchUrl(q, types, size) {
    return API + "/foods/search?api_key=" + API_KEY + "&query=" + encodeURIComponent(q) +
      "&dataType=" + encodeURIComponent(types) + "&pageSize=" + size;
  }

  function runSearch(q) {
    if (searchCtrl) searchCtrl.abort();
    searchCtrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var signal = searchCtrl && searchCtrl.signal;
    results = { query: q, loading: true, generic: [], branded: [] };
    renderSearchBody();
    if (!navigator.onLine) {
      results = { query: q, generic: [], branded: [], error: { title: "No internet connection", text: "Food search needs internet. Recent foods still work offline." } };
      renderSearchBody(); return;
    }
    Promise.allSettled([
      fetchJSON(searchUrl(q, "Foundation,SR Legacy,Survey (FNDDS)", 12), signal),
      fetchJSON(searchUrl(q, "Branded", 15), signal)
    ]).then(function (out) {
      if ($("search").value.trim() !== q) return;
      var g = out[0], b = out[1];
      if (g.status === "rejected" && b.status === "rejected") {
        if (g.reason && g.reason.name === "AbortError") return;
        var st = (g.reason && g.reason.status) || (b.reason && b.reason.status);
        results = { query: q, generic: [], branded: [], error: st ? apiError(st) : { title: "Couldn't reach the food database", text: "Check your connection and try again." } };
      } else {
        results = {
          query: q,
          generic: g.status === "fulfilled" ? (g.value.foods || []) : [],
          branded: b.status === "fulfilled" ? (b.value.foods || []) : []
        };
      }
      renderSearchBody();
    });
  }

  $("search").addEventListener("input", function () {
    clearTimeout(searchTimer);
    var q = $("search").value.trim();
    if (q.length < 2) { results = null; renderSearchBody(); return; }
    results = { query: q, loading: true, generic: [], branded: [] };
    renderSearchBody();
    searchTimer = setTimeout(function () { runSearch(q); }, 350);
  });
  $("search").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { clearTimeout(searchTimer); var q = $("search").value.trim(); if (q.length >= 2) runSearch(q); $("search").blur(); }
  });
  $("clearBtn").addEventListener("click", function () { $("search").value = ""; results = null; renderSearchBody(); $("search").focus(); });

  // ---------- Food detail ----------
  function showView(v) {
    view = v;
    $("backBtn").hidden = v === "search";
    $("searchWrap").hidden = v !== "search";
    $("sheetTitle").textContent = v === "custom" ? "Custom food" : "Add food";
    $("sheetTitle").hidden = v === "detail";
  }

  function openDetailFromSearch(item) {
    var map = mapFromSearch(item);
    current = {
      fdcId: item.fdcId,
      name: niceName(item.description),
      brand: item.dataType === "Branded" ? niceName(item.brandName || item.brandOwner || "") : "",
      dataType: item.dataType,
      per100: per100FromMap(map),
      nutrients: keepNutrients(map),
      units: buildUnits(item),
      unitIndex: 0,
      qty: null,
      loading: true
    };
    current.qty = defaultQty(current.units[0]);
    showView("detail");
    renderDetail();
    $("sheetBody").scrollTop = 0;

    if (detailCtrl) detailCtrl.abort();
    detailCtrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var want = current;
    fetchJSON(API + "/food/" + item.fdcId + "?api_key=" + API_KEY, detailCtrl && detailCtrl.signal).then(function (food) {
      if (current !== want) return;
      var dmap = mapFromDetail(food);
      var dp = per100FromMap(dmap);
      if (dp.kcal != null || dp.protein != null) current.per100 = dp;
      current.nutrients = keepNutrients(Object.assign({}, map, dmap));
      var oldLabel = current.units[current.unitIndex].label;
      var merged = buildUnits(Object.assign({}, item, { foodPortions: food.foodPortions, servingSize: food.servingSize || item.servingSize, servingSizeUnit: food.servingSizeUnit || item.servingSizeUnit, householdServingFullText: food.householdServingFullText || item.householdServingFullText }));
      var keep = merged.findIndex(function (u) { return u.label === oldLabel; });
      current.units = merged;
      if (keep >= 0 && !current.touched) {
        // A real portion (like "1 cup") is a better starting point than raw grams
        if (isRawUnit(oldLabel) && !isRawUnit(merged[0].label)) { current.unitIndex = 0; current.qty = defaultQty(merged[0]); }
        else current.unitIndex = keep;
      } else if (keep >= 0) current.unitIndex = keep;
      else { current.unitIndex = 0; current.qty = defaultQty(merged[0]); }
      current.loading = false;
      renderDetail();
    }).catch(function (err) {
      if (err && err.name === "AbortError") return;
      if (current !== want) return;
      current.loading = false;
      renderDetail();
    });
  }

  function openDetailFromEntry(e) {
    var units = [{ label: e.unitLabel, grams: e.unitGrams }];
    if (!e.custom) {
      var liquid = /\bml\b|fl oz/.test(e.unitLabel);
      (liquid ? [{ label: "ml", grams: 1 }, { label: "fl oz", grams: 29.5735 }] : [{ label: "g", grams: 1 }, { label: "oz", grams: 28.3495 }])
        .forEach(function (u) { if (u.label !== e.unitLabel) units.push(u); });
    }
    current = {
      fdcId: e.fdcId, name: e.name, brand: e.brand || "", dataType: e.dataType || "", custom: !!e.custom,
      per100: e.per100, nutrients: e.nutrients || {}, units: units, unitIndex: 0, qty: e.qty, loading: false, touched: true
    };
    showView("detail");
    renderDetail();
    $("sheetBody").scrollTop = 0;
  }

  function nutCell(label, color, value) {
    var v = value == null ? '<div class="v na">not available</div>' : '<div class="v num">' + fmtG(value) + '<span style="font-size:12px;font-weight:600"> g</span></div>';
    return '<div>' + v + '<div class="k"><span class="dot" style="--c:' + color + '"></span>' + label + '</div></div>';
  }

  function renderDetail() {
    if (!current) return;
    var u = current.units[current.unitIndex];
    var qty = current.qty > 0 ? current.qty : 0;
    var grams = u.grams * qty;
    var p = current.per100;
    var kcal = amountFor(p, grams, "kcal");
    var typeName = { "Branded": "Branded food", "Foundation": "Foundation food", "SR Legacy": "Standard reference", "Survey (FNDDS)": "Survey food" }[current.dataType] || "";

    $("sheetBody").innerHTML =
      '<div class="detail">' +
        '<div><h3>' + esc(current.name) + '</h3>' + (current.brand ? '<div class="brand">' + esc(current.brand) + '</div>' : '') + '</div>' +
        '<div class="amount">' +
          '<label for="qtyInput">Amount</label>' +
          '<input id="qtyInput" type="text" inputmode="decimal" value="' + esc(fmtQty(current.qty || 0)) + '" aria-label="Amount">' +
          '<select id="unitSelect" aria-label="Unit">' + current.units.map(function (x, i) {
            return '<option value="' + i + '"' + (i === current.unitIndex ? ' selected' : '') + '>' + esc(x.label) + '</option>';
          }).join("") + '</select>' +
        '</div>' +
        timeFieldHtml() +
        '<div class="nut-card" id="nutCard">' + nutHtml(kcal, grams) + '</div>' +
        '<div class="source">' + (current.custom ? 'Custom food you entered' : 'Source: USDA FoodData Central' + (typeName ? ' · ' + typeName : '')) + (current.loading ? ' · <span class="loading-line">loading serving sizes…</span>' : '') + '</div>' +
        '<div class="detail-foot"><button class="primary" type="button" id="addBtn"' + (qty > 0 ? '' : ' disabled') + '>Log ' + KINDS[sheetKind].toLowerCase() + '</button></div>' +
      '</div>';
    bindTimeField();

    $("qtyInput").addEventListener("input", function () {
      var raw = this.value.replace(",", ".");
      var n = parseFloat(raw);
      current.qty = isFinite(n) && n > 0 ? n : 0;
      current.touched = true;
      updateNut();
    });
    $("qtyInput").addEventListener("focus", function () { this.select(); });
    $("unitSelect").addEventListener("change", function () {
      var prev = current.units[current.unitIndex];
      current.unitIndex = +this.value;
      var next = current.units[current.unitIndex];
      if (isRawUnit(next.label) !== isRawUnit(prev.label) || (next.label === "g") !== (prev.label === "g")) current.qty = defaultQty(next);
      current.touched = true;
      $("qtyInput").value = fmtQty(current.qty);
      updateNut();
    });
    $("addBtn").addEventListener("click", addCurrent);
  }

  function nutHtml(kcal, grams) {
    var p = current.per100;
    return '<div class="nut-kcal"><div class="v num">' + (kcal == null ? "–" : fmt(kcal)) + '<small>kcal</small></div>' +
      '<div class="est">' + (p.est ? "Calories estimated from macros" : current.custom ? "" : (grams ? fmtG(grams) + (/\bml\b|fl oz/.test(current.units[current.unitIndex].label) ? " ml" : " g") : "")) + '</div></div>' +
      '<div class="nut-grid">' +
        nutCell("Protein", "var(--protein)", amountFor(p, grams, "protein")) +
        nutCell("Carbs", "var(--carbs)", amountFor(p, grams, "carbs")) +
        nutCell("Fat", "var(--fat)", amountFor(p, grams, "fat")) +
        nutCell("Fiber", "var(--fiber)", amountFor(p, grams, "fiber")) +
      '</div>';
  }

  function updateNut() {
    var u = current.units[current.unitIndex];
    var grams = u.grams * (current.qty || 0);
    $("nutCard").innerHTML = nutHtml(amountFor(current.per100, grams, "kcal"), grams);
    $("addBtn").disabled = !(current.qty > 0);
  }

  function addCurrent() {
    if (!current || !(current.qty > 0)) return;
    var u = current.units[current.unitIndex];
    logEntry({
      fdcId: current.fdcId, name: current.name, brand: current.brand, dataType: current.dataType, custom: current.custom || undefined,
      unitLabel: u.label, unitGrams: u.grams, qty: current.qty,
      per100: current.per100, nutrients: current.nutrients
    });
  }

  function logEntry(fields) {
    var e = Object.assign({ id: nextId(), date: dayKey(), kind: sheetKind, time: validTime(sheetTime) ? sheetTime : nowHHMM() }, fields);
    state.entries.push(e);
    save();
    expanded = null;
    render();
    closeSheet();
    toast("Logged " + e.name.split(",")[0] + " as a " + KINDS[e.kind].toLowerCase());
  }

  // ---------- Time field (shared by detail and custom) ----------
  function timeFieldHtml() {
    return '<div class="field"><label for="timeInput">Time eaten</label>' +
      '<input class="time-in" id="timeInput" type="time" value="' + esc(sheetTime) + '" style="height:50px;font-size:16px"></div>';
  }
  function bindTimeField() {
    var t = $("timeInput");
    if (t) t.addEventListener("change", function () { if (validTime(this.value)) sheetTime = this.value; });
  }

  // ---------- Custom food ----------
  var showMore = false;
  function numField(id, label, unit, color, big) {
    return '<div class="field"><label for="' + id + '">' + (color ? '<span class="dot" style="--c:' + color + '"></span>' : '') + label + '</label>' +
      '<div class="unit"><input id="' + id + '" type="text" inputmode="decimal" autocomplete="off"' + (big ? ' class="big"' : '') + ' placeholder="0"><span>' + unit + '</span></div></div>';
  }
  function openCustom() {
    current = null; showMore = false;
    showView("custom");
    $("sheetBody").innerHTML =
      '<div class="form">' +
        '<div class="field"><label for="cName">Name</label><input id="cName" type="text" autocomplete="off" placeholder="For example: chipotle bowl"></div>' +
        numField("cKcal", "Calories", "kcal", "", true) +
        '<div class="grid2">' + numField("cProtein", "Protein", "g", "var(--protein)") + numField("cCarbs", "Carbs", "g", "var(--carbs)") + '</div>' +
        '<div class="grid2">' + numField("cFat", "Fat", "g", "var(--fat)") + numField("cFiber", "Fiber", "g", "var(--fiber)") + '</div>' +
        '<button class="more-btn" type="button" id="moreBtn">+ More nutrients</button>' +
        '<div class="grid2" id="moreFields" hidden>' + numField("cSugar", "Sugar", "g") + numField("cSat", "Saturated fat", "g") + numField("cSodium", "Sodium", "mg") + '</div>' +
        '<div class="check" id="cCheck"></div>' +
        timeFieldHtml() +
        '<div class="detail-foot"><button class="primary" type="button" id="addBtn" disabled>Log ' + KINDS[sheetKind].toLowerCase() + '</button></div>' +
      '</div>';
    $("sheetBody").scrollTop = 0;
    bindTimeField();
    $("moreBtn").addEventListener("click", function () { $("moreFields").hidden = false; this.hidden = true; });
    $("sheetBody").querySelector(".form").addEventListener("input", checkCustom);
    $("addBtn").addEventListener("click", addCustom);
    setTimeout(function () { var n = $("cName"); if (n) n.focus(); }, 280);
  }
  function customValues() {
    return {
      kcal: parseNum($("cKcal").value), protein: parseNum($("cProtein").value), carbs: parseNum($("cCarbs").value),
      fat: parseNum($("cFat").value), fiber: parseNum($("cFiber").value),
      sugar: parseNum($("cSugar").value), sat: parseNum($("cSat").value), sodium: parseNum($("cSodium").value)
    };
  }
  function checkCustom() {
    var v = customValues();
    $("addBtn").disabled = v.kcal == null;
    var el = $("cCheck");
    if (v.protein == null && v.carbs == null && v.fat == null) { el.textContent = ""; el.className = "check"; return; }
    var fromMacros = (v.protein || 0) * 4 + (v.carbs || 0) * 4 + (v.fat || 0) * 9;
    var off = v.kcal != null && v.kcal > 0 && Math.abs(fromMacros - v.kcal) / v.kcal > 0.2 && Math.abs(fromMacros - v.kcal) > 40;
    el.className = "check" + (off ? " warn" : "");
    el.textContent = "Macros add up to about " + fmt(fromMacros) + " kcal." + (off ? " That's far from the calories above, so double-check the numbers." : "");
  }
  function addCustom() {
    var v = customValues();
    if (v.kcal == null) return;
    var name = $("cName").value.trim() || "Custom food";
    var nutrients = {};
    if (v.sugar != null) nutrients[2000] = v.sugar;
    if (v.sat != null) nutrients[1258] = v.sat;
    if (v.sodium != null) nutrients[1093] = v.sodium;
    logEntry({
      custom: true, name: name, brand: "", dataType: "Custom",
      unitLabel: "serving", unitGrams: 100, qty: 1,
      per100: { kcal: v.kcal, protein: v.protein, carbs: v.carbs, fat: v.fat, fiber: v.fiber, est: false },
      nutrients: nutrients
    });
  }

  function backToSearch() {
    if (detailCtrl) detailCtrl.abort();
    current = null;
    showView("search");
    renderSearchBody();
  }

  // ---------- Sheet open / close ----------
  function openSheet() {
    sheetKind = "meal";
    sheetTime = nowHHMM();
    $("search").value = "";
    results = null; current = null;
    renderKind(); showView("search"); renderSearchBody();
    $("scrim").hidden = false; $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      $("scrim").classList.add("show"); $("sheet").classList.add("show");
    }); });
  }
  function closeSheet() {
    if (searchCtrl) searchCtrl.abort();
    if (detailCtrl) detailCtrl.abort();
    $("search").blur();
    $("scrim").classList.remove("show"); $("sheet").classList.remove("show");
    document.body.style.overflow = "";
    setTimeout(function () { $("scrim").hidden = true; $("sheet").hidden = true; }, 260);
  }

  $("logBtn").addEventListener("click", function () { openSheet(); });
  $("doneBtn").addEventListener("click", closeSheet);
  $("backBtn").addEventListener("click", backToSearch);
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("sheet").hidden) { if (view !== "search") backToSearch(); else closeSheet(); }
  });
  $("kindSeg").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-kind]"); if (!b) return;
    sheetKind = b.dataset.kind; renderKind();
  });
  $("sheetBody").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-pick],[data-recent],[data-custom]"); if (!b) return;
    if (b.dataset.custom) { $("search").blur(); openCustom(); return; }
    if (b.dataset.recent) {
      var e = state.entries.find(function (x) { return x.id === +b.dataset.recent; });
      if (e) openDetailFromEntry(e);
      return;
    }
    var key = b.dataset.pick, list = key[0] === "g" ? results.generic : results.branded;
    var item = list[+key.slice(1)];
    if (item) { $("search").blur(); openDetailFromSearch(item); }
  });

  // ---------- Toast ----------
  var toastTimer;
  function toast(msg) {
    var el = $("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2000);
  }

  // New day while the app stays open
  var lastDay = dayKey();
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && dayKey() !== lastDay) { lastDay = dayKey(); expanded = null; render(); }
  });

  render();
})();
</script>
<script>
["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
  document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
